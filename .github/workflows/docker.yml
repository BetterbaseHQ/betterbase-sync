name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Serialize runs for the same ref so concurrent tags can't race on the
# shared {{major}}.{{minor}} tag (last-writer-wins is correct, but the
# winner should be deterministic).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build one arch per native runner and push per-arch images by digest on
  # tags. Native arm64 runners keep the Rust compile fast (no QEMU).
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare platform label
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # GHCR repository names must be lowercase; github.repository is not
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # docker/setup-buildx-action@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        # docker/login-action@v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        # docker/build-push-action@v7
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Keep provenance off: with push-by-digest, a provenance attestation
          # would be grafted into the merged manifest as a bogus platform.
          provenance: false
          # Per-platform scope: a shared scope makes the matrix legs overwrite
          # each other's cache, forcing a cold compile for one arch every run.
          cache-from: type=gha,scope=buildkit-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ env.PLATFORM_PAIR }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/') && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME_LC) || '' }}

      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected digest from build step: '$digest'" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/')
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 3

  # Merge the per-arch images into a multi-arch manifest and apply tags.
  merge:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # actions/download-artifact@v8
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # docker/setup-buildx-action@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Prepare image name
        run: |
          # GHCR repository names must be lowercase; github.repository is not
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        # docker/login-action@v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # flavor latest=true: publishes :latest on every release tag (the
      # default latest=auto would too for semver tags, but we are explicit).
      - name: Extract metadata
        id: meta
        # docker/metadata-action@v6
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          count=$(ls -1 | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "Expected 2 platform digests, found $count" >&2
            exit 1
          fi
          # Restore OCI annotations. imagetools create only supports index:
          # and manifest-descriptor: scopes — remap metadata-action's
          # manifest: annotations to the image index (per-manifest
          # annotation isn't supported by imagetools).
          args=()
          while IFS= read -r ann; do
            args+=(--annotation "index:${ann#manifest:}")
          done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create \
            "${args[@]}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@sha256:%s ' *)

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:$VERSION"
